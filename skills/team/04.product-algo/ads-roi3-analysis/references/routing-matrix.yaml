    output_contract: 中文日报/趋势矩阵 + rows JSON（/tmp/ads-workspace/roi3/）
    known_failures:
      - ClickHouse 直连失败时走 DataSuite fallback，耗时上升
    freshness_rule: 日级表，T+1 为准
    estimated_cost: 分钟级

  - id: profitability-dimensional-analysis
    match:
      question_type: [评估, 探索]
      lever: [发给谁, 发多少]
      layer: [效果指标层]
      # 触发：维度边际利润率 / 利润率 / 按 entrance·品类·人群·价格带 施加差异化系数的实验
    maturity: skill
    entrypoint: ads-roi3-profitability-analysis
    owner: roger.li
    route_priority: 78
    trigger_keywords: [边际利润率, 利润率分析, 边际还有没有空间, 维度发券, 分维度调系数, entrance维度, 品类维度, 预算分配是否生效]
    negative_keywords: [生成日报, rollout文档, EGO eval, AUUC, 纯控制器trace]
    required_inputs: [实验桶或coef档实验, 维度(entrance/L0/人群/价格带), value口径(advv 或 advv+broad_gmv/W), 时间窗]
    preflight_checks:
      - 系数复合关系已问清（线上强度约 10 实验连乘，本实验是哪层/和谁复合/是否正交；决定能否用叠加 dose 实验测调整后边际）
      - 维度字段映射已确认（entrance id↔名称、L0 品类 l1_id 映射；entrance 映射曾是 best-effort，跑前必确认）
      - 施策类实验：先做落地验证（动作-响应闭环），未落地不出效率结论
      - value 口径显式（advv 单口径与 advv+broad_gmv/W 结论可能反向）
      - 边际需多档 coef 实验（拟合切线）；单桶只能算利润率——除非有正交叠加的 dose 实验可在本桶内切片测边际
      - 打平/趋同类目标：看维度间边际离散度下降 + 趋近 λ；近线性 b≈0 时打平靠一阶移预算
      - 先确认实验运行天数 ≥ trailing 窗（≈14 天）：新实验往往不够（如品类实验仅上线数天），边际/打平结论坐实不了，只能给落地验证+平均利润率+方向信号；多天取数必须分天串行（PB 表单查超时，实测 6 分钟未回）
    output_contract: 总-分-附录报告，按"施策类实验评估范式"四步；维度表含 边际利润率/份额/CI/系数/动作/落地
    known_failures:
      - broad_order_cnt>0 幸存者偏差（只在成交行估边际，保本结论偏乐观）
      - gmv_995_v2 可能缺失，用 platform_gmv_usd 作 proxy 需注明
      - 多维系数相乘破坏预算中性（重复抑制），叠加桶单独评估
      - ent29 等低边际离群 entrance 映射需线上 entrance_group_idx 核对
    freshness_rule: 维度系数频繁变；边际估计 trailing 窗 ≥14 天
    estimated_cost: 小时级（多档拟合 + bootstrap CI + 双维度口径）

  - id: roi3-diagnosis
    match:
      question_type: [诊断]
      layer: [效果指标层, 模型层, 策略层]
      # guardrail 拆解 / 价值窗口 / 品类(level0)级 guardrail / 小时级发券诊断 / base vs exp 真值
    maturity: skill
    entrypoint: ads-roi3-diagnosis-v2
    owner: team-04.product-algo
    route_priority: 90
    trigger_keywords: [为什么, 根因, 诊断, guardrail没涨, coverage掉, cost升, 小时级发券诊断, base vs exp真值]
    negative_keywords: [生成日报, 周报, rollout文档, EGO eval, AUUC]
    required_inputs: [region, date, 症状(为什么 coverage 掉/guardrail 没涨/cost 升)]
    preflight_checks:
      - 默认 v2（统一 L0 底座 + 真 platform_gmv guardrail + 价值窗口 CDF）；要 v1 对比才用 ads-roi3-rootcause-diagnosis
    output_contract: Markdown 诊断报告（confirmed/likely/possible/unknown 分级）
    known_failures:
      - "⚠️ 不做'深档饱和 vs 流量不足'判别（全仓零饱和逻辑）——饱和类问题路由到 profitability-dimensional-analysis 的饱和判别 checklist，勿误路由至此"
      - 纯日级 readout 用 roi3-daily-monitoring；纯控制器 trace 用 roi3-budget-control
    freshness_rule: 日级/小时级，T+1
    estimated_cost: 分钟级

