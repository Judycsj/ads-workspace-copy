  - id: net-incremental-did
    match:
      question_type: [评估, 探索]
      layer: [效果指标层]
      evidence: [观测对比]
      # 净增量价值 / 剥离自然增长 / DiD / 调整后边际带 CI / "花得值不值"
    maturity: playbook
    entrypoint: skills/team/04.product-algo/ads-roi3-experiment-analysis/references/did-net-incremental.md
    owner: roger.li
    route_priority: 72
    trigger_keywords: [净增量, 剥离自然增长, DiD, 差分法, 花得值不值, 自然增长]
    negative_keywords: [有明确AB桶读数, 生成日报, rollout文档, EGO eval]
    required_inputs: [region/档, 实验前N天基线窗, 实验期窗, value口径]
    preflight_checks:
      - 平行趋势检验（实验前两桶斜率差≤15%）；不满足则 DiD 打折
      - value 双口径并行（advv + broad_gmv）；右偏重尾时 CI 切 order-level cluster bootstrap
    output_contract: 净增量 value/cost + 调整后边际利润率带 CI + 打平/显著判定（周会决策树）
    known_failures:
      - 直接 test−control 会把自然增长算进发券效果，必须 DiD 或纯差分按情形选
      - 天数不足 trailing 窗 CI 很宽，只作方向信号
    freshness_rule: 满日累计；trailing ≥14 天才坐实
    estimated_cost: 小时级（基线+趋势检验+bootstrap）

  - id: cross-layer-joint-analysis
    match:
      question_type: [评估, 读数]
      evidence: [AB实验]
      # 两实验在不同正交层，看 (层A桶×层B桶) 组合格 vs prod默认组合：模型层×策略层、模型×预算、策略×强度…
      # 触发词：交叉实验/联合分析/正交叠加/两个layer/组合格/cross cell/ab_sign 两层取桶
    maturity: playbook
    entrypoint: skills/team/04.product-algo/ads-roi3-analysis/references/cross-layer-joint-analysis.md
    owner: roger.li
    route_priority: 83
    trigger_keywords: [交叉实验, 联合分析, 正交叠加, 两个layer, 组合格, cross cell, ab_sign两层取桶]
    negative_keywords: [单实验readout, 生成日报, rollout文档, EGO eval]
    required_inputs: [两层各自桶号与流量%, 目标组合格与prod默认base组合, 时间窗(满日), regions, value口径]
    preflight_checks:
      - Step0 正交性确认：两层独立分流、scene/layer_id 已确认；组合格流量=两层份额相乘
      - base=层A_base×层B_base 的 prod 默认组合（不是任一单层 base）
      - 打平流量用分流日志用户数（exogenous），严禁用曝光/点击（被处理影响，会翻转结论）
      - 全盘 platform_gmv 跨臂走 split-log（分流日志按 user join 订单），不用 voucher_click_context
      - 抽干格剔除：用户/曝光比远偏设计份额比则弃
    output_contract: 总-分-附录报告（spoke experiment-analysis 出）；双栏指标表+VPR+稳健性；明写隔离了什么/没隔离什么
    known_failures:
      - 曝光打平把效果除掉、翻转结论（2026-06-22 rev +2.2% 被假掉成 −1.7%）—— 只能 per-user 打平
      - AB 平台单实验报表是跨另一层 blended，不能当组合格读
      - perf 表个人 Presto 被 Ranger 拒、重 join 超时 → DataSuite（POLL_MAX_RETRIES 调高）
      - 组合格流量小（~1%），需多满日；单格易被抽干
    freshness_rule: 满日累计；组合格小，trailing ≥14 天才坐实，否则只作方向信号
    estimated_cost: 小时级（两路取数 perf + split-log + 合并打平）

  - id: synthesis-boss-account
    match:
      question_type: [评估, 决策]
      # 老板级跨实验总账：赚不赚/值不值/扩不扩，多实验摊同口径合成判断
    maturity: playbook
    entrypoint: skills/team/04.product-algo/ads-roi3-analysis/references/synthesis-playbook.md
    owner: roger.li
    route_priority: 75
    trigger_keywords: [ROI3赚不赚, 值不值, 扩不扩, 老板怎么看, 总账, 一页纸, 多实验合成]
    negative_keywords: [单实验readout, 生成日报, EGO eval, rollout文档]
    required_inputs: [父问题, 涉及哪些实验/region/档, 受众(中层/VP)]
    sub_cells: [预算转移读数(experiment-analysis), 维度边际(profitability), 全局dose边际, 各实验净增量(did-net-incremental)]
    merge_rule: 新鲜度过滤(标可信度等级)→同口径对齐(advv+broad_gmv双栏)→加权聚合→冲突处理
    conflict_handling: 五分类(口径/证据层/新鲜度/因果关联/叠加效应)，报冲突+给前提，不硬合；口径反向自动标红
    preflight_checks:
      - 每子读数标运行天数→可信度(坐实≥14d/方向信号7-13d/不足<7d)，数据不够显式标"不知道"
      - VP 版强制输出实测闭环 vs 模型外推两栏（外推标高估风险）
    output_contract: 一页纸（结论先行+同口径对比表+饱和地图+实测vs外推两栏+诚实标注+动作）
    known_failures:
      - v1 半自动（非全自动合成）；当前多实验仅 ~4-6 天，多数子读数只能给方向信号
      - 平均 ROI 永远好看，会掩盖边际已塌的部分——必须看边际不看平均
    freshness_rule: 受最新子读数约束
    estimated_cost: 小时级（多实验聚合 + 冲突核对）

  - id: out-of-scope-sentinel
    # 边界哨兵：在 manual-fallback 兜底前先查超域信号，命中则主动说不+指路，别让模糊跨域诉求被兜底接住才发现做不了（Round2 暴露）
    match:
      out_of_scope_signals: [用户LTV/cohort/留存/复购/用户ID纵向序列, 长期因果/习惯养成/撤券衰减/6-12周, 自然推荐流量隔离/对全站非广告GMV净影响, MP券×Ads券交叉归因, 大促实时自适应/动态特征/供给侧预测]
    maturity: 超域
    entrypoint: 主动说不 + 指路（ROI3 单域=订单桶级×短期7-14天×发券→交易AB/DiD 因果）
    owner: roger.li
    route_priority: 100
    output_contract: 一句话说清 ROI3 能做的那部分（如发券对 ROI3 自身净增量）+ 超域部分指向（CRM/商智/推荐/经济学/引擎，见设计蓝本 §8）
    known_failures:
      - 用户粒度纵向/LTV/留存→CRM/商智；长期因果/习惯养成→预估模型/经济学(明确不做)；自然流量隔离→推荐系统；MP×Ads交叉→商务政策；大促实时→引擎/供应链
      - 切忌为接住而硬塞跨域能力（会越界、ROI 低）；诚实划界比勉强承接更有价值

  - id: manual-fallback
    match:
      question_type: [校验, 读数, 诊断, 探索, 评估, 决策]   # 任意格兜底
    maturity: 手工
    entrypoint: ads-text2da
    owner: roger.li
    required_inputs: [明确的取数口径（表/字段/过滤）, 时间窗]
    preflight_checks:
      - 口径已在 data-sources.md 或 datamap 中核对（首跑前 desc 表确认字段）
    output_contract: 按 report-skeleton.md 组织产出；结论须标注三分类（事实/快照/推断）
    known_failures:
      - 自由 SQL 容易踩口径坑——先查 data-sources.md 的已知坑清单
    freshness_rule: 逐次确认
    estimated_cost: 视查询而定（声明给用户）
