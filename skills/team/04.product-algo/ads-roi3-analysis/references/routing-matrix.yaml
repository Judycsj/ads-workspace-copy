# 路由注册表/Routing Registry
# hub 只读本文件路由，不靠现场理解文档。新增能力 = 加一条 entry，hub 零改动。
# match 维度：question_type ∈ [校验,读数,诊断,探索,评估,决策]；
#   lever ∈ [发多少,发给谁,怎么发,怎么控]；layer ∈ [效果指标层,控制器层,模型层,策略层,数据口径层]；
#   evidence ∈ [AB实验,观测对比,线上trace,模型外推]
# maturity ∈ [手工, playbook, skill]
# 可选路由字段：route_priority 越高越先匹配；trigger_keywords / negative_keywords 用于
# overlap 场景消歧（如“生成日报”直达 monitoring，“日报里异常为什么”进 diagnosis）。
# 合成类 entry 额外声明 sub_cells / merge_rule / conflict_handling，
#   冲突五分类：口径冲突 / 证据层冲突 / 新鲜度冲突 / 因果关联冲突 / 叠加效应冲突；原则=报冲突+给口径前提，不硬合。
version: 1
updated: "2026-06-23"

entries:
  - id: experiment-analysis
    match:
      question_type: [评估, 读数]
      evidence: [AB实验]
    maturity: skill
    entrypoint: ads-roi3-experiment-analysis
    owner: roger.li
    route_priority: 80
    trigger_keywords: [实验 readout, 实验效果评估, base vs exp, 多桶对比, 实验该不该扩, AB实验读数]
    negative_keywords: [生成日报, ROI3日报, 周报, rollout文档, 全量申请文档, EGO eval, AUUC, uplift PCOC]
    required_inputs: [实验标识或桶号, 时间窗, regions, value口径]
    preflight_checks:
      - 涉及券类型/新字段/新口径：先查 data-sources.md §2 + docs/common/datamap，禁止现翻记忆/tmp 旧 SQL 重新发现已登记口径（2026-06-17 教训）
      - 跨臂比"总券/MP/平台券"或做 SRM：用全流量源（P0 ClickHouse 按 exp_tag，或 AB 分流日志 scene1361/layer190830 按 user 分桶），勿用 voucher_click_context（只在 ads 券订单上，有选择偏差）
      - 实验桶映射已在 experiment-contracts.md 确认；快照超 7 天先经 sp-ab 刷新
      - 时间窗均为满日（表落库滞后约 2 小时）
      - value 口径已锁定；高风险决策 multi_caliber=true
    output_contract: 总-分-附录报告 + 会话内结论速览；归档"一分析一中文文件夹" docs/personal/<user>/roi3/experiments/<中文分析事项>-<YYYYMMDD>/（报告 + 伴生 -repro.md，见 report-skeleton.md 归档结构与命名）
    known_failures:
      - voucher_click_context 只落在 ads 券订单上（orders==voucher_orders）→ 跨臂比 MP/总券选择偏差；干净分桶用 AB 分流日志（scene1361/layer190830）按 user join 订单
      - 券类型×实验臂(ads/MP smart/MP local)走 raw log 订单级 join 很慢（~8min/满日，串行）；优先 P0 ClickHouse（秒级，但当前仅 ads/total，smart 拆分待扩列）
      - ClickHouse DataSuite 会话约数分钟过期（pycookiecheat 缺失/token 失效），连查会断，刷新 Chrome 登录后重试，勿降级到慢的 Presto raw-log
      - 预算转移实验口径下 SG 无数据、BR 数据残缺（R<1）；MY 低量日比值虚高，看绝对花费/多日
      - 重订单级查询并行会饿死队列（mkplpaidads-adhoc），必须串行
      - 网关不支持 lambda 表达式（dim_voucher 取 smart 用 UNNEST 不用 filter）
      - text2da 脚本须用 venv python 直跑（python3 入口 re-exec 失效，报 dataservice 不可用）— 见 data-sources.md §3
      - 实验放量有爬坡期，未放量日（订单个位数）按天 R 是噪声，满日检验须剔除
    freshness_rule: 实验配置快照超过 7 天须重新确认
    estimated_cost: 分钟级

  - id: model-uplift-offline-eval
    match:
      question_type: [评估, 校验, 读数]
      layer: [模型层]
      evidence: [模型外推, 观测对比]
      # 触发：ads-roi3-gmv-uplift-analysis / roi3-gmv-uplift-analysis / /ego-gmv-uplift / ego-auuc / EGO eval job / 离线评估指标 / AUUC / uplift PCOC / platform_gmv_uplift / 新旧 base 对比
    maturity: skill
    entrypoint: ads-roi3-gmv-uplift-analysis
    owner: team-04.product-algo
    route_priority: 85
    trigger_keywords: [ads-roi3-gmv-uplift-analysis, roi3-gmv-uplift-analysis, /ego-gmv-uplift, ego-auuc, EGO eval job, AUUC, uplift PCOC, pgmv_0_pcoc, platform_gmv_uplift, 新版base离线指标]
    negative_keywords: [线上AB结论, rollout文档, 全量申请, 日报, 周报, guardrail根因]
    required_inputs: [base/exp EGO eval job 或版本名, eval日期或共同最新日期, target family(platform_gmv_uplift 或 CR uplift), 输出位置(会话/Sheet/报告)]
    preflight_checks:
      - 明确这是模型离线 eval 证据，不替代线上 AB/rollout 结论；上线决策需再接 experiment-analysis 或 rollout-doc
      - base/exp 使用同一 eval 数据日；若用户未给日期，用两侧共同最新 eval date，不混用不同天
      - platform GMV 任务必须确认目标族包含 platform_gmv_0 与 platform_gmv_uplift_{95,92,88,85,80}_{auuc,pcoc}
      - Grafana 取数必须用 All Metrics Per Day + All Custom Metrics Per Day；不要用默认 gAUC/AUC panel
      - 写 Sheet 前先读取表头；同 date+version 更新旧行，没有匹配才 append；70 档不默认写入
      - 产出需同时给原始 metrics、base/exp delta、uplift_pcoc error(abs(pcoc-1))、跨档均衡性(max-min/std/平均偏离1)、验收阈值对照
    output_contract: EGO 离线评估结论速览 + metrics/delta 表 + 验收对照；可写 Google Sheet 或归档到项目 analysis/
    known_failures:
      - ads-roi3-gmv-uplift-analysis 依赖本地 EGO/Grafana/Google OAuth 凭据；缺凭据时只能做 job 元信息或 wiring 检查，不能把空指标当真实结果
      - Custom metric 为空常见原因是取错 panel 或 plugin 未产出；先换 All Custom Metrics Per Day，再查 ego_plugin_path/target name
      - base/exp eval 日期不一致会制造假提升；必须对齐共同日期或明确标注不可比
      - platform GMV uplift 与 CR uplift target 命名不同；未确认 target family 前不要套错 schema
      - AUUC 改善与 PCOC 改善含义不同：AUUC 是排序能力，PCOC 是校准；验收标准需分别解读
    freshness_rule: EGO eval job 快照；每次新 job/date 重新拉 Grafana，不复用旧 Sheet 行
    estimated_cost: 分钟级

  - id: roi3-daily-monitoring
    match:
      question_type: [读数]
      layer: [效果指标层]
    maturity: skill
    entrypoint: ads-roi3-monitoring-report
    owner: team-04.product-algo
    route_priority: 65
    trigger_keywords: [生成ROI3日报, ROI3日报, ROI3 monitoring, ROI3趋势, ROI3走势, 最新一天数据]
    negative_keywords: [为什么, 根因, 诊断, 异常, guardrail没涨, coverage掉, 该不该扩]
